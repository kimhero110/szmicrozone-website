# Nginx 生产环境与 Tailscale 预览配置
# 放置于 /etc/nginx/conf.d/szmicrozone.conf

# 1. 内网 / Tailscale 直连访问与预览端口 (HTTP 无证书告警)
server {
    listen 80;
    listen 8088;
    server_name 100.64.0.24 172.18.18.61 localhost;

    root /var/www/szmicrozone;
    index index.html;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_vary on;

    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

# 2. 公网域名 HTTP 自动跳转 HTTPS
server {
    listen 80;
    server_name szmicrozone.com www.szmicrozone.com;
    location /.well-known/acme-challenge/ { root /var/www/szmicrozone; }
    location / { return 301 https://szmicrozone.com$request_uri; }
}

# 3. 公网域名 HTTPS 访问
server {
    listen 443 ssl http2;
    server_name szmicrozone.com www.szmicrozone.com;

    ssl_certificate     /etc/letsencrypt/live/szmicrozone.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/szmicrozone.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL_sz:10m;
    ssl_session_timeout 1d;

    root /var/www/szmicrozone;
    index index.html;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_vary on;

    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
}
